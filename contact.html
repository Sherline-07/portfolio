<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description"
        content="Contact form for the Sherline portfolio.">

    <meta name="author" content="Sherline">

    <title>Contact | Sherline</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header class="site-header">

        <div class="container header-content">

            <a href="index.html" class="logo" aria-label="Sherline portfolio home">
                Sherline
            </a>

            <nav aria-label="Main navigation">

                <ul class="nav-list">

                    <li>
                        <a href="index.html">Home</a>
                    </li>

                    <li>
                        <a href="about.html">About</a>
                    </li>

                    <li>
                        <a href="projects.html">Projects</a>
                    </li>

                    <li>
                        <a href="contact.html" aria-current="page">
                            Contact
                        </a>
                    </li>

                </ul>

            </nav>

            <button
                type="button"
                class="theme-toggle"
                id="themeToggle"
                aria-label="Switch to dark mode"
                aria-pressed="false">
                ☾
            </button>

        </div>

    </header>


    <main>

        <section class="page-header" aria-labelledby="contact-title">

            <div class="container">

                <p class="section-label">Connect</p>

                <h1 id="contact-title">Contact</h1>

                <p>
                    Use the form below to send a message.
                </p>

            </div>

        </section>


        <section class="section" aria-labelledby="form-title">

            <div class="container contact-container">

                <div class="contact-intro">

                    <p class="section-label">Get in Touch</p>

                    <h2 id="form-title">Let's Connect</h2>

                    <p>
                        Have a question or want to connect? Send a message
                        using the form below.
                    </p>

                </div>


                <form id="contactForm">


                    <div class="form-group">

                        <label for="name">
                            Name
                        </label>

                        <input
                            type="text"
                            id="name"
                            name="name"
                            autocomplete="name"
                            required
                            aria-required="true">

                    </div>


                    <div class="form-group">

                        <label for="email">
                            Email
                        </label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            autocomplete="email"
                            required
                            aria-required="true">

                    </div>


                    <div class="form-group">

                        <label for="subject">
                            Subject
                        </label>

                        <input
                            type="text"
                            id="subject"
                            name="subject"
                            required
                            aria-required="true">

                    </div>


                    <div class="form-group">

                        <label for="message">
                            Message
                        </label>

                        <textarea
                            id="message"
                            name="message"
                            rows="6"
                            required
                            aria-required="true"></textarea>

                    </div>


                    <button type="submit" class="button">
                        Send Message
                    </button>


                    <p
                        id="formMessage"
                        class="form-message"
                        role="status"
                        aria-live="polite">
                    </p>

                </form>

            </div>

        </section>

    </main>


    <footer class="site-footer">

        <div class="container">

            <p>
                &copy; 2026 Sherline. All rights reserved.
            </p>

        </div>

    </footer>


    <script src="js/script.js"></script>

</body>

</html>
